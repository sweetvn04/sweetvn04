<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Fira+Code:wght@400;600;700&amp;display=swap');

      .bg {
        fill: #080c10;
        stroke: #00ff66;
        stroke-width: 1.5;
        rx: 6px;
        filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.3));
      }

      .header-base {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00ff66;
        filter: drop-shadow(0 0 8px #00ff66) drop-shadow(0 0 16px rgba(0, 255, 102, 0.7));
        animation: glitch-anim 2.5s infinite alternate;
        letter-spacing: 1px;
      }

      .header-red {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #ff0055;
        opacity: 0;
        animation: glitch-red-anim 2.5s infinite alternate;
        letter-spacing: 1px;
      }

      .header-cyan {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00f0ff;
        opacity: 0;
        animation: glitch-cyan-anim 2.5s infinite alternate;
        letter-spacing: 1px;
      }

      .label {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #00ff66;
        font-weight: 700;
        filter: drop-shadow(0 0 3px rgba(0, 255, 102, 0.4));
      }

      .value {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #dbe4ee;
        font-weight: 400;
      }

      .highlight {
        fill: #00f0ff;
        font-weight: 700;
        filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.6));
      }

      .corner {
        stroke: #00ff66;
        stroke-width: 3;
        fill: none;
        filter: drop-shadow(0 0 5px #00ff66);
      }

      .divider {
        stroke: #00ff66;
        stroke-opacity: 0.3;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      @keyframes glitch-anim {
        0%, 75% { transform: translate(0, 0); }
        76% { transform: translate(-3px, 1px); }
        78% { transform: translate(3px, -1px); }
        80% { transform: translate(-1px, 2px); }
        82% { transform: translate(0, 0); }
        90% { transform: translate(2px, 0); }
        92% { transform: translate(0, 0); }
      }

      @keyframes glitch-red-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        75% { transform: translate(-4px, -1px); opacity: 0.85; }
        78% { transform: translate(3px, 1px); opacity: 0.8; }
        80% { transform: translate(-2px, 0); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(3px, -1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes glitch-cyan-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        76% { transform: translate(4px, 1px); opacity: 0.85; }
        78% { transform: translate(-3px, -1px); opacity: 0.8; }
        80% { transform: translate(2px, 1px); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(-3px, 1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="796" height="176" class="bg" />

  <!-- Corner Brackets -->
  <path d="M 2 18 L 2 2 L 18 2" class="corner" />
  <path d="M 782 2 L 798 2 L 798 18" class="corner" />
  <path d="M 2 162 L 2 178 L 18 178" class="corner" />
  <path d="M 782 178 L 798 178 L 798 162" class="corner" />

  <!-- Glowing Header with Glitch Layers -->
  <text x="25" y="30" class="header-red">🎮 PLAYER STATUS // HUD SUMMARY</text>
  <text x="25" y="30" class="header-cyan">🎮 PLAYER STATUS // HUD SUMMARY</text>
  <text x="25" y="30" class="header-base">🎮 PLAYER STATUS // HUD SUMMARY</text>

  <line x1="20" y1="42" x2="780" y2="42" class="divider" />

  <!-- Content Rows -->
  <g transform="translate(25, 64)">
    <text x="0" y="0" class="label">PLAYER<tspan class="value">: sweetvn (Nguyen Quoc Bao)</tspan></text>
    <text x="440" y="0" class="label">LEVEL<tspan class="value">: 21 </tspan><tspan class="highlight">[CS Senior @ CUSC]</tspan></text>

    <text x="0" y="24" class="label">CLASS <tspan class="value">: Backend Intern → </tspan><tspan class="highlight">DevOps / Platform Engineer</tspan></text>

    <text x="0" y="48" class="label">TARGET<tspan class="value">: Kubernetes · Terraform / IaC · Go · Linux SysAdmin &amp; Security</tspan></text>

    <text x="0" y="74" class="label">HP    : <tspan fill="#00ff66" filter="drop-shadow(0 0 5px #00ff66)">████████████████████████</tspan><tspan class="value"> 100/100</tspan></text>
    <text x="440" y="74" class="label">MANA  : <tspan fill="#00f0ff" filter="drop-shadow(0 0 5px #00f0ff)">████████████████████░░░░</tspan><tspan class="value"> 85/100</tspan></text>

    <text x="0" y="98" class="label">EXP   : <tspan class="value">Building dynamic enterprise platforms &amp; homelab systems</tspan></text>
  </g>
</svg>
