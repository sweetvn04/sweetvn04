<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 175" width="100%" height="175">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Fira+Code:wght@400;600;700&amp;display=swap');

      .bg {
        fill: #0d1117;
        stroke: #00ff66;
        stroke-width: 1.5;
        rx: 6px;
      }

      .card-header {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #00ff66;
        animation: glitch-anim 4s infinite;
        letter-spacing: 1px;
      }

      .label {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #00ff66;
        font-weight: 700;
      }

      .value {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #c9d1d9;
        font-weight: 400;
      }

      .highlight {
        fill: #00f0ff;
        font-weight: 600;
      }

      .bar-filled {
        fill: #00ff66;
      }

      .bar-empty {
        fill: #21262d;
      }

      .corner {
        stroke: #00ff66;
        stroke-width: 3;
        fill: none;
      }

      .divider {
        stroke: #21262d;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      @keyframes glitch-anim {
        0%, 90%, 100% {
          transform: translate(0);
          filter: none;
        }
        91% {
          transform: translate(-2px, 1px);
          filter: drop-shadow(-2px 0 #ff0055) drop-shadow(2px 0 #00ffff);
        }
        93% {
          transform: translate(2px, -1px);
          filter: drop-shadow(2px 0 #ff0055) drop-shadow(-2px 0 #00ff66);
        }
        95% {
          transform: translate(0);
          filter: none;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="796" height="171" class="bg" />

  <!-- Corner Brackets -->
  <path d="M 2 16 L 2 2 L 16 2" class="corner" />
  <path d="M 784 2 L 798 2 L 798 16" class="corner" />
  <path d="M 2 159 L 2 173 L 16 173" class="corner" />
  <path d="M 784 173 L 798 173 L 798 159" class="corner" />

  <!-- Header -->
  <text x="25" y="28" class="card-header">🎮 PLAYER STATUS // HUD SUMMARY</text>
  <line x1="20" y1="38" x2="780" y2="38" class="divider" />

  <!-- Content Rows -->
  <g transform="translate(25, 58)">
    <!-- Row 1 -->
    <text x="0" y="0" class="label">PLAYER<tspan class="value">: sweetvn (Nguyen Quoc Bao)</tspan></text>
    <text x="440" y="0" class="label">LEVEL<tspan class="value">: 21 </tspan><tspan class="highlight">[CS Senior @ CUSC]</tspan></text>

    <!-- Row 2 -->
    <text x="0" y="24" class="label">CLASS <tspan class="value">: Backend Intern → </tspan><tspan class="highlight">DevOps / Platform Engineer</tspan></text>

    <!-- Row 3 -->
    <text x="0" y="48" class="label">TARGET<tspan class="value">: Kubernetes · Terraform / IaC · Go · Linux SysAdmin &amp; Security</tspan></text>

    <!-- Row 4: Status Bars -->
    <text x="0" y="74" class="label">HP    : <tspan fill="#00ff66">████████████████████████</tspan><tspan class="value"> 100/100</tspan></text>
    <text x="440" y="74" class="label">MANA  : <tspan fill="#00f0ff">████████████████████░░░░</tspan><tspan class="value"> 85/100</tspan></text>

    <!-- Row 5 -->
    <text x="0" y="98" class="label">EXP   : <tspan class="value">Building dynamic enterprise platforms &amp; homelab systems</tspan></text>
  </g>
</svg>
