<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Fira+Code:wght@400;600;700&amp;display=swap');

      .bg {
        fill: #080c10;
        stroke: #00f0ff;
        stroke-width: 1.5;
        rx: 6px;
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.35));
      }

      .header-base {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00f0ff;
        filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 16px rgba(0, 240, 255, 0.7));
        animation: glitch-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .header-red {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #ff0055;
        opacity: 0;
        animation: glitch-red-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .header-green {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00ff66;
        opacity: 0;
        animation: glitch-green-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .quest-tag {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #00f0ff;
        font-weight: 700;
        filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.5));
      }

      .quest-title {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #ffffff;
        font-weight: 700;
      }

      .quest-desc {
        font-family: 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #98a5b3;
      }

      .corner {
        stroke: #00f0ff;
        stroke-width: 3;
        fill: none;
        filter: drop-shadow(0 0 5px #00f0ff);
      }

      .divider {
        stroke: #00f0ff;
        stroke-opacity: 0.3;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      @keyframes glitch-anim {
        0%, 75% { transform: translate(0, 0); }
        76% { transform: translate(-3px, 1px); }
        78% { transform: translate(3px, -1px); }
        80% { transform: translate(-1px, 2px); }
        82% { transform: translate(0, 0); }
        90% { transform: translate(2px, 0); }
        92% { transform: translate(0, 0); }
      }

      @keyframes glitch-red-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        75% { transform: translate(-5px, -1px); opacity: 0.85; }
        78% { transform: translate(4px, 1px); opacity: 0.8; }
        80% { transform: translate(-2px, 0); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(3px, -1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes glitch-green-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        76% { transform: translate(4px, 1px); opacity: 0.85; }
        78% { transform: translate(-3px, -1px); opacity: 0.8; }
        80% { transform: translate(3px, 1px); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(-3px, 1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="796" height="196" class="bg" />

  <!-- Corner Brackets -->
  <path d="M 2 18 L 2 2 L 18 2" class="corner" />
  <path d="M 782 2 L 798 2 L 798 18" class="corner" />
  <path d="M 2 182 L 2 198 L 18 198" class="corner" />
  <path d="M 782 198 L 798 198 L 798 182" class="corner" />

  <!-- Glowing Header with Glitch Layers -->
  <text x="25" y="30" class="header-red">⚔️ ACTIVE QUEST LOG // MISSIONS</text>
  <text x="25" y="30" class="header-green">⚔️ ACTIVE QUEST LOG // MISSIONS</text>
  <text x="25" y="30" class="header-base">⚔️ ACTIVE QUEST LOG // MISSIONS</text>

  <line x1="20" y1="42" x2="780" y2="42" class="divider" />

  <!-- Content Rows -->
  <g transform="translate(25, 64)">
    <text x="0" y="0">
      <tspan class="quest-tag">[★ MAIN QUEST] </tspan>
      <tspan class="quest-title">G2B Dynamic Report &amp; Form Designer Platform</tspan>
    </text>
    <text x="20" y="18" class="quest-desc">Role: Backend Intern @ CUSC • Stack: Next.js · TypeScript · Drizzle ORM · MySQL · Gitea CI/CD</text>

    <text x="0" y="44">
      <tspan class="quest-tag">[✦ SIDE QUEST] </tspan>
      <tspan class="quest-title">Hoshino — Autonomous Zalo AI Companion</tspan>
    </text>
    <text x="20" y="62" class="quest-desc">Host: sweetvn2004.id.vn • Stack: Node.js · zca-js · Gemini API (Modular client roadmap)</text>

    <text x="0" y="88">
      <tspan class="quest-tag">[✦ SIDE QUEST] </tspan>
      <tspan class="quest-title">lazycat — Docker Compose TUI Manager</tspan>
    </text>
    <text x="20" y="106" class="quest-desc">Stack: Python · Rich TUI · Conventional Commits • Terminal container management</text>

    <text x="0" y="132">
      <tspan class="quest-tag">[⚔️ RAID LAB ] </tspan>
      <tspan class="quest-title">Homelab Citadel Infrastructure</tspan>
    </text>
    <text x="20" y="150" class="quest-desc">Docker · Gitea · Ollama · Nginx Proxy Manager · Tailscale VPN · Cloudflare DDNS</text>
  </g>
</svg>
