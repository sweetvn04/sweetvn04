<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 175" width="100%" height="175">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Fira+Code:wght@400;600;700&amp;display=swap');

      .bg {
        fill: #080c10;
        stroke: #00f0ff;
        stroke-width: 1.5;
        rx: 6px;
        filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.35));
      }

      .header-base {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00f0ff;
        filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 16px rgba(0, 240, 255, 0.7));
        animation: glitch-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .header-red {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #ff0055;
        opacity: 0;
        animation: glitch-red-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .header-green {
        font-family: 'Press Start 2P', monospace;
        font-size: 11.5px;
        fill: #00ff66;
        opacity: 0;
        animation: glitch-green-anim 2.4s infinite alternate;
        letter-spacing: 1px;
      }

      .project-tag {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #00f0ff;
        font-weight: 700;
        filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.5));
      }

      .project-name {
        font-family: 'Fira Code', monospace;
        font-size: 12.5px;
        fill: #ffffff;
        font-weight: 700;
      }

      .project-desc {
        font-family: 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #98a5b3;
      }

      .corner {
        stroke: #00f0ff;
        stroke-width: 3;
        fill: none;
        filter: drop-shadow(0 0 5px #00f0ff);
      }

      .divider {
        stroke: #00f0ff;
        stroke-opacity: 0.3;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      @keyframes glitch-anim {
        0%, 75% { transform: translate(0, 0); }
        76% { transform: translate(-3px, 1px); }
        78% { transform: translate(3px, -1px); }
        80% { transform: translate(-1px, 2px); }
        82% { transform: translate(0, 0); }
        90% { transform: translate(2px, 0); }
        92% { transform: translate(0, 0); }
      }

      @keyframes glitch-red-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        75% { transform: translate(-5px, -1px); opacity: 0.85; }
        78% { transform: translate(4px, 1px); opacity: 0.8; }
        80% { transform: translate(-2px, 0); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(3px, -1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }

      @keyframes glitch-green-anim {
        0%, 74% { transform: translate(0, 0); opacity: 0; }
        76% { transform: translate(4px, 1px); opacity: 0.85; }
        78% { transform: translate(-3px, -1px); opacity: 0.8; }
        80% { transform: translate(3px, 1px); opacity: 0.9; }
        82% { transform: translate(0, 0); opacity: 0; }
        90% { transform: translate(-3px, 1px); opacity: 0.8; }
        92% { transform: translate(0, 0); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="796" height="171" class="bg" />

  <!-- Corner Brackets -->
  <path d="M 2 18 L 2 2 L 18 2" class="corner" />
  <path d="M 782 2 L 798 2 L 798 18" class="corner" />
  <path d="M 2 153 L 2 169 L 18 169" class="corner" />
  <path d="M 782 169 L 798 169 L 798 153" class="corner" />

  <!-- Glowing Header with Glitch Layers -->
  <text x="25" y="30" class="header-red">PROJECTS // FEATURED REPOSITORIES</text>
  <text x="25" y="30" class="header-green">PROJECTS // FEATURED REPOSITORIES</text>
  <text x="25" y="30" class="header-base">PROJECTS // FEATURED REPOSITORIES</text>

  <line x1="20" y1="42" x2="780" y2="42" class="divider" />

  <!-- Content Rows -->
  <g transform="translate(25, 65)">
    <!-- Row 1 -->
    <text x="0" y="0">
      <tspan class="project-tag">[G2B Designer ] </tspan>
      <tspan class="project-name">Dynamic Form &amp; Report Platform </tspan>
      <tspan class="project-desc">• Next.js · TypeScript · Drizzle · MySQL · Gitea CI/CD</tspan>
    </text>

    <!-- Row 2 -->
    <text x="0" y="26">
      <tspan class="project-tag">[Hoshino Bot  ] </tspan>
      <tspan class="project-name">Personal Zalo AI Companion </tspan>
      <tspan class="project-desc">• Node.js · zca-js · Gemini API · sweetvn2004.id.vn</tspan>
    </text>

    <!-- Row 3 -->
    <text x="0" y="52">
      <tspan class="project-tag">[lazycat TUI  ] </tspan>
      <tspan class="project-name">Docker Compose TUI Manager </tspan>
      <tspan class="project-desc">• Python · Rich CLI · Conventional Commits</tspan>
    </text>

    <!-- Row 4 -->
    <text x="0" y="78">
      <tspan class="project-tag">[Homelab Infra] </tspan>
      <tspan class="project-name">Self-Hosted Services Cluster </tspan>
      <tspan class="project-desc">• Docker · Gitea · Ollama · Nginx PM · Tailscale</tspan>
    </text>
  </g>
</svg>
