<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Fira+Code:wght@500;700&amp;display=swap');

      .bg {
        fill: #0d1117;
        stroke: #00ff66;
        stroke-width: 1.5;
        rx: 8px;
      }

      .glitch-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 16px;
        fill: #00ff66;
        font-weight: bold;
        animation: glitch-anim 3.5s infinite;
        letter-spacing: 1px;
      }

      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        fill: #8b949e;
        letter-spacing: 0.5px;
      }

      .highlight {
        fill: #00f0ff;
        font-weight: bold;
      }

      .corner {
        stroke: #00ff66;
        stroke-width: 3;
        fill: none;
      }

      @keyframes glitch-anim {
        0%, 88%, 100% {
          transform: translate(0);
          filter: none;
        }
        89% {
          transform: translate(-2px, 1px);
          filter: drop-shadow(-2px 0 #ff0055) drop-shadow(2px 0 #00ffff);
        }
        91% {
          transform: translate(2px, -1px);
          filter: drop-shadow(2px 0 #ff0055) drop-shadow(-2px 0 #00ff66);
        }
        93% {
          transform: translate(-1px, -1px);
          filter: drop-shadow(-1px 0 #00ffff) drop-shadow(1px 0 #ff0055);
        }
        95% {
          transform: translate(0);
          filter: none;
        }
        97% {
          transform: translate(1px, 1px);
          filter: drop-shadow(1px 0 #ff0055) drop-shadow(-1px 0 #00ffff);
        }
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="796" height="86" class="bg" />

  <!-- Corner Accents -->
  <path d="M 2 20 L 2 2 L 20 2" class="corner" />
  <path d="M 780 2 L 798 2 L 798 20" class="corner" />
  <path d="M 2 70 L 2 88 L 20 88" class="corner" />
  <path d="M 780 88 L 798 88 L 798 70" class="corner" />

  <!-- Content -->
  <g text-anchor="middle">
    <text x="400" y="40" class="glitch-title">SWEETVN // LV.21 [NGUYEN QUOC BAO]</text>
    <text x="400" y="65" class="subtitle">
      CLASS: <tspan class="highlight">BACKEND DEV</tspan> → <tspan class="highlight">DEVOPS / PLATFORM ENGINEER</tspan> • STAGE: <tspan fill="#e6edf3">CUSC SENIOR</tspan>
    </text>
  </g>
</svg>
